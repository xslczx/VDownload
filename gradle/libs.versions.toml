[versions]
coreKtx = "1.10.1"
lifecycleRuntimeKtx = "2.6.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-livedata-ktx = { group = "androidx.lifecycle", name = "lifecycle-livedata-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-appcompat = "androidx.appcompat:appcompat:1.7.1"
androidx-recyclerview = "androidx.recyclerview:recyclerview:1.2.1"

# AGP 与 Kotlin 插件版本统一在根 build.gradle.kts 的 buildscript 里维护
# （AGP 8.3.2 / Kotlin 1.9.22，KSP 1.9.22-1.0.17 在 app/build.gradle.kts）。
# 注意不要再在此处声明 plugins：此前遗留的 kotlin 2.2.21 与 KSP 1.9.22 不兼容。
